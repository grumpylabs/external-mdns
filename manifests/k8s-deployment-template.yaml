apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-mdns
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: external-mdns
  template:
    metadata:
      labels:
        app: external-mdns
    spec:
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
      hostNetwork: true
      serviceAccountName: external-mdns
      containers:
      - name: external-mdns
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        image: macrbg/external-mdns:0873b7f3 
        args:
        - -source=ingress
        - -source=service
        - -truncate-long-records=true 
        - -publish-internal-services=true
        env:
          - name: EXTERNAL_MDNS_NAMESPACE
            value: "" 
          - name: EXTERNAL_MDNS_DEFAULT_NAMESPACE
            value: "default" 
          - name: EXTERNAL_MDNS_KUBECONFIG
            value: "" 
